[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-image-mark-tool"
dynamic = ["version"]
description = "Local photo metadata and watermark workflow"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "CC-BY-SA-4.0"
keywords = ["photo", "metadata", "watermark"]
dependencies = [
  "PySide6-Essentials==6.11.2",
  "Pillow>=12.0,<13",
  "fonttools>=4.60,<5",
  "rawpy>=0.27.1,<0.28",
  "openpyxl>=3.1.5,<4",
  "platformdirs>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "pip==24.0",
  "pip-tools==7.6.1",
  "setuptools==84.0.0",
  "wheel==0.48.0",
  "pytest>=8.4,<10",
  "pytest-qt>=4.5,<5",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<1",
  "mypy>=1.17,<2",
  "pyinstaller>=6.16,<7",
  "pefile>=2022.5.30,<2027",
  "pywin32-ctypes>=0.2.1,<1",
]

[project.scripts]
aim-tool = "aim_tool.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "aim_tool.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "raw: requires a real RAW sample",
  "visual: requires approved visual assets",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pip-tools]
allow_unsafe = true
