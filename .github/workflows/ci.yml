name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-checks:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install locked dependencies
        run: |
          python -m pip install pip==24.0
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check
      - name: Check source
        run: |
          python -m ruff check src tests scripts packaging
          python -m ruff format --check src tests scripts packaging
          python -m mypy src/aim_tool
      - name: Test package and GUI bootstrap
        run: |
          python -m pytest tests/unit -q
          python -m pytest tests/gui -q
      - name: Verify pinned ExifTool
        shell: pwsh
        run: |
          python scripts/fetch_tools.py --manifest packaging/toolchain.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (& tools/exiftool/exiftool.exe -ver).Trim()
          if ($version -ne '13.59') { throw "Unexpected ExifTool version: $version" }
