name: GPS preview native Windows build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-exe:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.3'
      - name: Install locked dependencies
        run: |
          python -m venv .venv
          .venv/Scripts/python.exe -m pip install pip==24.0
          .venv/Scripts/python.exe -m pip install --require-hashes -r requirements-dev.lock
          .venv/Scripts/python.exe -m pip install --no-deps --no-build-isolation -e .
          .venv/Scripts/python.exe -m pip check
      - name: Fetch and verify pinned ExifTool
        run: |
          .venv/Scripts/python.exe scripts/fetch_tools.py --manifest packaging/toolchain.json
          test "$(tools/exiftool/exiftool.exe -ver)" = "13.59"
      - name: Run integration checks
        run: |
          .venv/Scripts/python.exe -m pytest tests/unit tests/integration tests/gui -q
      - name: Build and smoke native EXE
        shell: pwsh
        run: .\scripts\build_gps.ps1
      - name: Upload native EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AutoImageMarkGps-windows-x64
          path: dist/gps-onefile/AutoImageMarkGps.exe
          if-no-files-found: error
          retention-days: 3
